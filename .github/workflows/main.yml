name: Generate MikroTik v7 IP Lists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools
        run: pip install aggregate6

      - name: Process IP Lists
        run: |
          mkdir -p data
          METO_URL="https://raw.githubusercontent.com/metowolf/iplist/master/data/isp"
          ASN_URL="https://raw.githubusercontent.com/ipverse/asn-ip/master/as"
          GAO_URL="https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists"
          
          CN_V4_BASE=$(mktemp)
          CN_V6_BASE=$(mktemp)
          curl -sSL http://ftp.apnic.net/stats/apnic/delegated-apnic-latest | grep ipv4 | grep CN | awk -F'|' '{printf "%s/%d\n", $4, 32-log($5)/log(2)}' > "$CN_V4_BASE"
          curl -sSL http://ftp.apnic.net/stats/apnic/delegated-apnic-latest | grep ipv6 | grep CN | awk -F'|' '{printf "%s/%d\n", $4, $5}' > "$CN_V6_BASE"

          cat << 'EOF' > filter_ip.py
          import ipaddress, sys
          def run():
              with open(sys.argv[1]) as f:
                  base_nets = [ipaddress.ip_network(l.strip()) for l in f if l.strip()]
              with open(sys.argv[2]) as f:
                  for l in f:
                      l = l.strip()
                      if not l: continue
                      try:
                          target = ipaddress.ip_network(l)
                          if any(target.overlaps(base) for base in base_nets):
                              print(target)
                      except: pass
          if __name__ == "__main__":
              run()
          EOF

          gen_isp_v4() {
            local list_name=$1
            local meto_file=$2
            local out_file="data/${3}.rsc"
            local tmp=$(mktemp)
            curl -sSLf "${METO_URL}/${meto_file}.txt" > "$tmp" || true
            {
              echo "/ip firewall address-list remove [find list=\"$list_name\"]"
              echo "/ip firewall address-list"
              grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}' "$tmp" | sort -u | aggregate6 | sed "s|^|add list=\"$list_name\" address=|g"
            } > "$out_file"
            cat "$tmp" >> all_v4_isp.txt
            rm "$tmp"
          }

          gen_isp_v6_refined() {
            local list_name=$1
            local out_file="data/${2}6.rsc"
            shift 2
            local asns=("$@")
            local tmp_asn=$(mktemp)
            local tmp_final=$(mktemp)
            for id in "${asns[@]}"; do
              curl -sSLf "${ASN_URL}/${id}/ipv6-aggregated.txt" >> "$tmp_asn" || true
            done
            python3 filter_ip.py "$CN_V6_BASE" "$tmp_asn" > "$tmp_final"
            {
              echo "/ipv6 firewall address-list remove [find list=\"${list_name}6\"]"
              echo "/ipv6 firewall address-list"
              sort -u "$tmp_final" | aggregate6 | sed "s|^|add list=\"${list_name}6\" address=|g"
            } > "$out_file"
            cat "$tmp_final" >> all_v6_isp.txt
            rm "$tmp_asn" "$tmp_final"
          }

          touch all_v4_isp.txt all_v6_isp.txt

          gen_isp_v4 "China_Telecom" "chinatelecom" "telecom"
          gen_isp_v6_refined "China_Telecom" "telecom" "4134" "4809" "23764"
          gen_isp_v4 "China_Unicom" "chinaunicom" "unicom"
          gen_isp_v6_refined "China_Unicom" "unicom" "4837" "9929" "17622" "10099"
          gen_isp_v4 "China_Mobile" "chinamobile" "cmcc"
          gen_isp_v6_refined "China_Mobile" "cmcc" "9808" "58453" "9394"

          TECH_ASNS=("45090" "37963" "132203" "138699" "38365" "133478" "132591" "55990" "131477" "134552" "139070" "140978" "58519" "136907" "137319")
          TMP_TECH_V4=$(mktemp)
          TMP_TECH_V6=$(mktemp)
          for id in "${TECH_ASNS[@]}"; do
            curl -sSLf "${ASN_URL}/${id}/ipv4-aggregated.txt" >> "$TMP_TECH_V4" || true
            curl -sSLf "${ASN_URL}/${id}/ipv6-aggregated.txt" >> "$TMP_TECH_V6" || true
          done

          CN_V4_FINAL=$(mktemp)
          echo "10.10.10.0/25" >> "$CN_V4_FINAL"
          echo "172.16.100.0/28" >> "$CN_V4_FINAL"
          cat "$CN_V4_BASE" >> "$CN_V4_FINAL"
          curl -sSLf "${GAO_URL}/china.txt" >> "$CN_V4_FINAL" || true
          cat all_v4_isp.txt >> "$CN_V4_FINAL"
          python3 filter_ip.py "$CN_V4_BASE" "$TMP_TECH_V4" >> "$CN_V4_FINAL"
          
          {
            echo "/ip firewall address-list remove [find list=\"CN\"]"
            echo "/ip firewall address-list"
            sort -u "$CN_V4_FINAL" | grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}' | aggregate6 | sed "s|^|add list=\"CN\" address=|g"
          } > data/cn.rsc

          CN_V6_FINAL=$(mktemp)
          cat "$CN_V6_BASE" >> "$CN_V6_FINAL"
          curl -sSLf "${GAO_URL}/china6.txt" >> "$CN_V6_FINAL" || true
          cat all_v6_isp.txt >> "$CN_V6_FINAL"
          python3 filter_ip.py "$CN_V6_BASE" "$TMP_TECH_V6" >> "$CN_V6_FINAL"

          {
            echo "/ipv6 firewall address-list remove [find list=\"CN6\"]"
            echo "/ipv6 firewall address-list"
            sort -u "$CN_V6_FINAL" | grep ':' | aggregate6 | sed "s|^|add list=\"CN6\" address=|g"
          } > data/cn6.rsc

          rm "$CN_V4_BASE" "$CN_V6_BASE" "$CN_V4_FINAL" "$CN_V6_FINAL" "$TMP_TECH_V4" "$TMP_TECH_V6" all_v4_isp.txt all_v6_isp.txt filter_ip.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.rsc
          git diff --quiet && git diff --staged --quiet || git commit -m "Update refined IP lists $(date +%Y-%m-%d)"
          git push origin main
