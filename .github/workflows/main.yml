name: Generate MikroTik v7 IP Lists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-mikrotik-rsc
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate IP Lists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data WORKDIR TMP_DATA

          GAOYIFAN="https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists"
          CHNROUTES2="https://raw.githubusercontent.com/misakaio/chnroutes2/master"
          IPVERSE="https://raw.githubusercontent.com/ipverse/asn-ip/master/as"

          download() {
            local url="$1"
            local output="$2"
            curl -fsSL --retry 5 --retry-delay 5 --connect-timeout 20 --max-time 30 -A "Mozilla/5.0" "$url" -o "$output"
            [ -s "$output" ] || { echo "ERROR: Empty or failed download: $url"; exit 1; }
            sleep 0.2
          }

          download_safe() {
            local url="$1"
            local output="$2"
            curl -fsSL --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 25 -A "Mozilla/5.0" "$url" -o "$output" || true
            [ -s "$output" ] || touch "$output"
            sleep 0.2
          }

          download "$GAOYIFAN/china.txt" WORKDIR/cn-gaoyifan.txt
          download "$GAOYIFAN/china6.txt" WORKDIR/cn6-gaoyifan.txt
          download "$CHNROUTES2/chnroutes.txt" WORKDIR/cn-chnroutes2.txt
          download_safe "$IPVERSE/139341/ipv4-aggregated.txt" WORKDIR/as139341.txt
          download_safe "$IPVERSE/132203/ipv4-aggregated.txt" WORKDIR/as132203.txt
          download_safe "$IPVERSE/139341/ipv6-aggregated.txt" WORKDIR/as139341-v6.txt
          download_safe "$IPVERSE/132203/ipv6-aggregated.txt" WORKDIR/as132203-v6.txt

          cat << 'EOF' > process.py
          import sys, ipaddress, os

          def normalize(src, dst, family):
              nets = []
              forbidden_v4 = [
                  ipaddress.ip_network("0.0.0.0/8"),
                  ipaddress.ip_network("10.0.0.0/8"),
                  ipaddress.ip_network("100.64.0.0/10"),
                  ipaddress.ip_network("127.0.0.0/8"),
                  ipaddress.ip_network("169.254.0.0/16"),
                  ipaddress.ip_network("172.16.0.0/12"),
                  ipaddress.ip_network("192.0.0.0/24"),
                  ipaddress.ip_network("192.0.2.0/24"),
                  ipaddress.ip_network("192.168.0.0/16"),
                  ipaddress.ip_network("198.18.0.0/15"),
                  ipaddress.ip_network("198.51.100.0/24"),
                  ipaddress.ip_network("203.0.113.0/24"),
                  ipaddress.ip_network("224.0.0.0/4"),
                  ipaddress.ip_network("240.0.0.0/4"),
              ]

              forbidden_v6 = [
                  ipaddress.ip_network("::/128"),
                  ipaddress.ip_network("::1/128"),
                  ipaddress.ip_network("::ffff:0:0/96"),
                  ipaddress.ip_network("2001:db8::/32"),
                  ipaddress.ip_network("fc00::/7"),
                  ipaddress.ip_network("fe80::/10"),
                  ipaddress.ip_network("ff00::/8"),
              ]

              if os.path.exists(src):
                  with open(src, 'r', encoding='utf-8-sig', errors='ignore') as f:
                      for line in f:
                          line = line.strip()
                          if not line or line.startswith(('#', '//')):
                              continue

                          tokens = line.replace(',', ' ').split()
                          for t in tokens:
                              if family == "ipv6" and ":" not in t:
                                  continue
                              if family == "ipv4" and "." not in t:
                                  continue
                              try:
                                  net = ipaddress.ip_network(t, strict=False)

                                  if family == "ipv4":
                                      if net.version != 4 or net.prefixlen == 32:
                                          continue
                                      if any(net.overlaps(bad) for bad in forbidden_v4):
                                          continue

                                  elif family == "ipv6":
                                      if net.version != 6 or net.prefixlen == 128:
                                          continue
                                      if any(net.overlaps(bad) for bad in forbidden_v6):
                                          continue

                                  nets.append(net)

                              except ValueError:
                                  pass

              merged = list(ipaddress.collapse_addresses(nets))

              with open(dst, 'w', encoding='utf-8') as f:
                  for net in merged:
                      f.write(f"{net}\n")

          cmd = sys.argv[1]
          if cmd == "norm":
              normalize(sys.argv[2], sys.argv[3], sys.argv[4])
          EOF

          (cat WORKDIR/cn-gaoyifan.txt; echo; cat WORKDIR/cn-chnroutes2.txt; echo; cat WORKDIR/as139341.txt; echo; cat WORKDIR/as132203.txt) > WORKDIR/cn-combined.raw
          (cat WORKDIR/cn6-gaoyifan.txt; echo; cat WORKDIR/as139341-v6.txt; echo; cat WORKDIR/as132203-v6.txt) > WORKDIR/cn6-combined.raw

          python3 process.py norm WORKDIR/cn-combined.raw WORKDIR/cn-final.final ipv4
          python3 process.py norm WORKDIR/cn6-combined.raw WORKDIR/cn6-final.final ipv6

          [ "$(wc -l < WORKDIR/cn-final.final)" -ge 3000 ] || { echo "ERROR: CN IPv4 count too small"; exit 1; }
          [ "$(wc -l < WORKDIR/cn6-final.final)" -ge 1000 ] || { echo "ERROR: CN IPv6 count too small"; exit 1; }

          export_rsc() {
            local list_name="$1"
            local input="$2"
            local output="$3"
            local ipv6="$4"

            local base_cmd="/ip firewall address-list"
            [ "$ipv6" = "true" ] && base_cmd="/ipv6 firewall address-list"

            {
              echo "$base_cmd remove [find where list=\"$list_name\"]"
              echo "$base_cmd"
              if [ -f "$input" ]; then
                while IFS= read -r cidr; do
                  [ -n "$cidr" ] && echo ":do { add list=\"$list_name\" address=$cidr } on-error={}"
                done < "$input"
              fi
            } > "$output"
          }

          export_rsc "CN" WORKDIR/cn-final.final TMP_DATA/cn.rsc false
          export_rsc "CN6" WORKDIR/cn6-final.final TMP_DATA/cn6.rsc true

          ISPS_KEYS=("China_Telecom" "China_Unicom" "China_Mobile" "CERNET" "CSTNET")
          ISPS_VALS=("chinanet.txt" "unicom.txt" "cmcc.txt" "cernet.txt" "cstnet.txt")
          ISPS_FILES=("telecom" "unicom" "cmcc" "cernet" "cstnet")
          ISPS_MIN=(500 200 200 10 5)

          for i in "${!ISPS_KEYS[@]}"; do
            list_name="${ISPS_KEYS[$i]}"
            file="${ISPS_VALS[$i]}"
            out_file="${ISPS_FILES[$i]}"
            min_lines="${ISPS_MIN[$i]}"

            download "$GAOYIFAN/$file" "WORKDIR/$out_file.txt"
            python3 process.py norm "WORKDIR/$out_file.txt" "WORKDIR/$out_file.final" ipv4
            [ "$(wc -l < "WORKDIR/$out_file.final")" -ge "$min_lines" ] || { echo "ERROR: $list_name count too small"; exit 1; }
            export_rsc "$list_name" "WORKDIR/$out_file.final" "TMP_DATA/$out_file.rsc" false
          done

          ISPS6_KEYS=("China_Telecom6" "China_Unicom6" "China_Mobile6" "CERNET6" "CSTNET6")
          ISPS6_VALS=("chinanet6.txt" "unicom6.txt" "cmcc6.txt" "cernet6.txt" "cstnet6.txt")
          ISPS6_FILES=("telecom6" "unicom6" "cmcc6" "cernet6" "cstnet6")
          ISPS6_MIN=(20 20 20 5 1)

          for i in "${!ISPS6_KEYS[@]}"; do
            list_name="${ISPS6_KEYS[$i]}"
            file="${ISPS6_VALS[$i]}"
            out_file="${ISPS6_FILES[$i]}"
            min_lines="${ISPS6_MIN[$i]}"

            download "$GAOYIFAN/$file" "WORKDIR/$out_file.txt"
            python3 process.py norm "WORKDIR/$out_file.txt" "WORKDIR/$out_file.final" ipv6
            [ "$(wc -l < "WORKDIR/$out_file.final")" -ge "$min_lines" ] || { echo "ERROR: $list_name count too small"; exit 1; }
            export_rsc "$list_name" "WORKDIR/$out_file.final" "TMP_DATA/$out_file.rsc" true
          done

          CBN_ASNS=(7641 146788 146838 9812 17429 24139 17962 17969 38355 131562 58834 58852 59016 23771 23841 24150 63539 63540 63607 63590)
          : > WORKDIR/cbnnet.txt
          : > WORKDIR/cbnnet6.txt

          for asn in "${CBN_ASNS[@]}"; do
            download_safe "$IPVERSE/$asn/ipv4-aggregated.txt" "WORKDIR/cbn-$asn.txt"
            cat "WORKDIR/cbn-$asn.txt" >> WORKDIR/cbnnet.txt
            echo >> WORKDIR/cbnnet.txt

            download_safe "$IPVERSE/$asn/ipv6-aggregated.txt" "WORKDIR/cbn-$asn-v6.txt"
            cat "WORKDIR/cbn-$asn-v6.txt" >> WORKDIR/cbnnet6.txt
            echo >> WORKDIR/cbnnet6.txt
          done

          python3 process.py norm WORKDIR/cbnnet.txt WORKDIR/cbnnet.final ipv4
          python3 process.py norm WORKDIR/cbnnet6.txt WORKDIR/cbnnet6.final ipv6

          [ "$(wc -l < WORKDIR/cbnnet.final)" -ge 10 ] || { echo "ERROR: CBNNET IPv4 count too small"; exit 1; }
          [ "$(wc -l < WORKDIR/cbnnet6.final)" -ge 1 ] || { echo "ERROR: CBNNET6 IPv6 count too small"; exit 1; }

          export_rsc "CBNNET" WORKDIR/cbnnet.final TMP_DATA/cbnnet.rsc false
          export_rsc "CBNNET6" WORKDIR/cbnnet6.final TMP_DATA/cbnnet6.rsc true

          rm -f data/*.rsc
          mv TMP_DATA/*.rsc data/

      - name: Commit & Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A data/

          if git diff --staged --quiet; then
            exit 0
          else
            git commit -m "Update MikroTik v7 IP lists (14 rsc files)"
            git push origin main
          fi
