name: Generate MikroTik v7 IP Lists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools
        run: pip install aggregate6

      - name: Process IP Lists
        run: |
          mkdir -p data
          
          ASN_BASE="https://raw.githubusercontent.com/ipverse/asn-ip/master/as"
          
          process_isp() {
            local list_name=$1
            local is_v6=$2
            local out_file=$3
            shift 3
            local asns=("$@")
            local tmp_raw=$(mktemp)
            local suffix="ipv4-aggregated.txt"
            local cmd_path="/ip firewall address-list"
            [ "$is_v6" = "true" ] && suffix="ipv6-aggregated.txt" && cmd_path="/ipv6 firewall address-list"

            for id in "${asns[@]}"; do
              curl -sSL --retry 3 "${ASN_BASE}/${id}/${suffix}" >> "$tmp_raw" || true
            done

            {
              echo "$cmd_path remove [find list=\"$list_name\"]"
              echo "$cmd_path"
              sort -u "$tmp_raw" | grep -E '(\.|:)' | aggregate6 | sed "s|^|add list=\"$list_name\" address=|g"
            } > "$out_file"
            rm "$tmp_raw"
          }

          process_isp "China_Telecom" false "data/telecom.rsc" "4134" "4809" "23764"
          process_isp "China_Telecom6" true "data/telecom6.rsc" "4134" "4809" "23764"
          
          process_isp "China_Unicom" false "data/unicom.rsc" "4837" "9929" "17622" "10099"
          process_isp "China_Unicom6" true "data/unicom6.rsc" "4837" "9929" "17622" "10099"
          
          process_isp "China_Mobile" false "data/cmcc.rsc" "9808" "58453" "9394"
          process_isp "China_Mobile6" true "data/cmcc6.rsc" "9808" "58453" "9394"

          process_isp "CERNET" false "data/cernet.rsc" "23910" "4538"
          process_isp "CERNET6" true "data/cernet6.rsc" "23910" "4538"

          process_isp "CSTNET" false "data/cstnet.rsc" "7497"
          process_isp "CSTNET6" true "data/cstnet6.rsc" "7497"

          process_isp "CBNNET" false "data/cbnnet.rsc" "137872" "138421"
          process_isp "CBNNET6" true "data/cbnnet6.rsc" "137872" "138421"

          process_isp "DRPENG" false "data/drpeng.rsc" "17962"
          process_isp "DRPENG6" true "data/drpeng6.rsc" "17962"

          CN_V4_RAW=$(mktemp)
          echo "10.10.10.0/25" >> "$CN_V4_RAW"
          echo "172.16.100.0/28" >> "$CN_V4_RAW"
          curl -sSL http://ftp.apnic.net/stats/apnic/delegated-apnic-latest | grep ipv4 | grep CN | awk -F'|' '{printf "%s/%d\n", $4, 32-log($5)/log(2)}' >> "$CN_V4_RAW"
          curl -sSL https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists/china.txt >> "$CN_V4_RAW"
          {
            echo "/ip firewall address-list remove [find list=\"CN\"]"
            echo "/ip firewall address-list"
            sort -u "$CN_V4_RAW" | aggregate6 | sed "s|^|add list=\"CN\" address=|g"
          } > data/cn.rsc

          CN_V6_RAW=$(mktemp)
          curl -sSL http://ftp.apnic.net/stats/apnic/delegated-apnic-latest | grep ipv6 | grep CN | awk -F'|' '{printf "%s/%d\n", $4, $5}' >> "$CN_V6_RAW"
          curl -sSL https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists/china6.txt >> "$CN_V6_RAW"
          {
            echo "/ipv6 firewall address-list remove [find list=\"CN6\"]"
            echo "/ipv6 firewall address-list"
            sort -u "$CN_V6_RAW" | aggregate6 | sed "s|^|add list=\"CN6\" address=|g"
          } > data/cn6.rsc

          rm "$CN_V4_RAW" "$CN_V6_RAW"

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.rsc
          git diff --quiet && git diff --staged --quiet || git commit -m "Update IP lists $(date +%Y-%m-%d)"
          git push origin main
