name: Generate Accurate MikroTik v7 IP Lists by ASN

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Network Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install netaddr

      - name: Process IP Lists by ASN
        run: |
          mkdir -p data

          cat << 'EOF' > process_asn.py
          import sys
          from netaddr import IPNetwork, cidr_merge

          def merge_and_export(input_files, output_file, ip_version):
              networks = []
              for infile in input_files.split(','):
                  try:
                      with open(infile, 'r') as f:
                          for line in f:
                              line = line.strip()
                              if not line or line.startswith('#'):
                                  continue
                              try:
                                  net = IPNetwork(line)
                                  if net.version == ip_version:
                                      networks.append(net)
                              except Exception:
                                  continue
                  except Exception:
                      continue

              merged = cidr_merge(networks)

              with open(output_file, 'w') as f:
                  for net in merged:
                      f.write(f"{net}\n")

          if __name__ == "__main__":
              version = int(sys.argv[1])
              in_files = sys.argv[2]
              out_file = sys.argv[3]
              merge_and_export(in_files, out_file, version)
          EOF

          fetch_asn() {
            local out=$1
            shift
            for asn in "$@"; do
              curl -sSL --retry 3 --connect-timeout 10 "https://raw.githubusercontent.com/ipverse/asn-ip/master/as/${asn}/ipv4-aggregated.txt" >> "${out}_v4.txt" 2>/dev/null || true
              curl -sSL --retry 3 --connect-timeout 10 "https://raw.githubusercontent.com/ipverse/asn-ip/master/as/${asn}/ipv6-aggregated.txt" >> "${out}_v6.txt" 2>/dev/null || true
              echo "" >> "${out}_v4.txt"
              echo "" >> "${out}_v6.txt"
            done
          }

          export_ros() {
            local list_name=$1
            local clean_file=$2
            local is_v6=$3
            local out_file=$4

            local cmd_path="/ip firewall address-list"
            if [ "$is_v6" = "true" ]; then
              cmd_path="/ipv6 firewall address-list"
            fi

            if [ ! -s "$clean_file" ]; then
              echo "# Empty list, skipped" > "$out_file"
              return
            fi

            {
              echo "$cmd_path remove [find list=\"$list_name\"]"
              echo "$cmd_path"
              sed "s|^|add list=\"$list_name\" address=|g" "$clean_file"
            } > "$out_file"
          }

          # 1. 中国电信 (China Telecom: AS4134, AS4809)
          fetch_asn telecom 4134 4809
          python3 process_asn.py 4 telecom_v4.txt telecom4_clean.txt
          export_ros "China_Telecom" telecom4_clean.txt false "data/telecom.rsc"
          python3 process_asn.py 6 telecom_v6.txt telecom6_clean.txt
          export_ros "China_Telecom6" telecom6_clean.txt true "data/telecom6.rsc"

          # 2. 中国联通 (China Unicom: AS4837, AS9929)
          fetch_asn unicom 4837 9929
          python3 process_asn.py 4 unicom_v4.txt unicom4_clean.txt
          export_ros "China_Unicom" unicom4_clean.txt false "data/unicom.rsc"
          python3 process_asn.py 6 unicom_v6.txt unicom6_clean.txt
          export_ros "China_Unicom6" unicom6_clean.txt true "data/unicom6.rsc"

          # 3. 中国移动 (China Mobile: AS9808, AS58453)
          fetch_asn cmcc 9808 58453
          python3 process_asn.py 4 cmcc_v4.txt cmcc4_clean.txt
          export_ros "China_Mobile" cmcc4_clean.txt false "data/cmcc.rsc"
          python3 process_asn.py 6 cmcc_v6.txt cmcc6_clean.txt
          export_ros "China_Mobile6" cmcc6_clean.txt true "data/cmcc6.rsc"

          # 4. 教育网 (CERNET: AS23910, AS4538)
          fetch_asn cernet 23910 4538
          python3 process_asn.py 4 cernet_v4.txt cernet4_clean.txt
          export_ros "CERNET" cernet4_clean.txt false "data/cernet.rsc"
          python3 process_asn.py 6 cernet_v6.txt cernet6_clean.txt
          export_ros "CERNET6" cernet6_clean.txt true "data/cernet6.rsc"

          # 5. 科技网 (CSTNET: AS7497)
          fetch_asn cstnet 7497
          python3 process_asn.py 4 cstnet_v4.txt cstnet4_clean.txt
          export_ros "CSTNET" cstnet4_clean.txt false "data/cstnet.rsc"
          python3 process_asn.py 6 cstnet_v6.txt cstnet6_clean.txt
          export_ros "CSTNET6" cstnet6_clean.txt true "data/cstnet6.rsc"

          # 6. 广电网络 (CBNNET: AS137872, AS138421)
          fetch_asn cbnnet 137872 138421
          python3 process_asn.py 4 cbnnet_v4.txt cbnnet4_clean.txt
          export_ros "CBNNET" cbnnet4_clean.txt false "data/cbnnet.rsc"
          python3 process_asn.py 6 cbnnet_v6.txt cbnnet6_clean.txt
          export_ros "CBNNET6" cbnnet6_clean.txt true "data/cbnnet6.rsc"

          # 7. 鹏博士 (DRPENG: AS17962)
          fetch_asn drpeng 17962
          python3 process_asn.py 4 drpeng_v4.txt drpeng4_clean.txt
          export_ros "DRPENG" drpeng4_clean.txt false "data/drpeng.rsc"
          python3 process_asn.py 6 drpeng_v6.txt drpeng6_clean.txt
          export_ros "DRPENG6" drpeng6_clean.txt true "data/drpeng6.rsc"

          # 8. 全国汇总 CN / CN6 列表（直接拉取标准 GeoIP 权威汇总）
          curl -sSL --retry 3 "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/cn.txt" > cn4_raw.txt
          python3 process_asn.py 4 cn4_raw.txt cn4_clean.txt
          export_ros "CN" cn4_clean.txt false "data/cn.rsc"

          curl -sSL --retry 3 "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/cn6.txt" > cn6_raw.txt
          python3 process_asn.py 6 cn6_raw.txt cn6_clean.txt
          export_ros "CN6" cn6_clean.txt true "data/cn6.rsc"

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.rsc
          git diff --quiet && git diff --staged --quiet || git commit -m "Update RouterOS IP lists via ASN $(date +%Y-%m-%d)"
          git push origin main
