name: Generate MikroTik v7 IP Lists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools
        run: pip install aggregate6

      - name: Process IP Lists
        run: |
          mkdir -p data
          BASE_URL="https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists"

          gen_rsc() {
            local list_name=$1
            local source_file=$2
            local is_v6=$3
            local out_file=$4
            local tmp_raw=$(mktemp)
            local cmd_path="/ip firewall address-list"
            [ "$is_v6" = "true" ] && cmd_path="/ipv6 firewall address-list"

            if [[ "$list_name" == "CN" && "$is_v6" == "false" ]]; then
              echo "10.10.10.0/25" >> "$tmp_raw"
              echo "172.16.100.0/28" >> "$tmp_raw"
            fi

            curl -sSLf "${BASE_URL}/${source_file}" >> "$tmp_raw" || true

            {
              echo "$cmd_path remove [find list=\"$list_name\"]"
              echo "$cmd_path"
              sort -u "$tmp_raw" | grep -E '(\.|:)' | aggregate6 | sed "s|^|add list=\"$list_name\" address=|g"
            } > "$out_file"
            rm "$tmp_raw"
          }

          gen_rsc "China_Telecom" "chinanet.txt" "false" "data/telecom.rsc"
          gen_rsc "China_Telecom6" "chinanet6.txt" "true" "data/telecom6.rsc"

          gen_rsc "China_Unicom" "unicom.txt" "false" "data/unicom.rsc"
          gen_rsc "China_Unicom6" "unicom6.txt" "true" "data/unicom6.rsc"

          gen_rsc "China_Mobile" "cmcc.txt" "false" "data/cmcc.rsc"
          gen_rsc "China_Mobile6" "cmcc6.txt" "true" "data/cmcc6.rsc"

          gen_rsc "CERNET" "cernet.txt" "false" "data/cernet.rsc"
          gen_rsc "CERNET6" "cernet6.txt" "true" "data/cernet6.rsc"

          gen_rsc "CSTNET" "cstnet.txt" "false" "data/cstnet.rsc"
          gen_rsc "CSTNET6" "cstnet6.txt" "true" "data/cstnet6.rsc"

          gen_rsc "DRPENG" "drpeng.txt" "false" "data/drpeng.rsc"
          gen_rsc "DRPENG6" "drpeng6.txt" "true" "data/drpeng6.rsc"

          gen_rsc "CN" "china.txt" "false" "data/cn.rsc"
          gen_rsc "CN6" "china6.txt" "true" "data/cn6.rsc"

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.rsc
          git diff --quiet && git diff --staged --quiet || git commit -m "Update IP lists $(date +%Y-%m-%d)"
          git push origin main
