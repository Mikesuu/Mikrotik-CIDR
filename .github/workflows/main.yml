name: Generate MikroTik v7 IP Lists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools
        run: pip install aggregate6

      - name: Process IP Lists
        run: |
          mkdir -p data
          METO_URL="https://raw.githubusercontent.com/metowolf/iplist/master/data/isp"
          ASN_URL="https://raw.githubusercontent.com/ipverse/asn-ip/master/as"
          
          CN_V6_BASE=$(mktemp)
          curl -sSL http://ftp.apnic.net/stats/apnic/delegated-apnic-latest | grep ipv6 | grep CN | awk -F'|' '{printf "%s/%d\n", $4, $5}' > "$CN_V6_BASE"

          gen_isp_v4() {
            local list_name=$1
            local meto_file=$2
            local out_file="data/${3}.rsc"
            local tmp=$(mktemp)
            curl -sSLf "${METO_URL}/${meto_file}.txt" > "$tmp" || true
            {
              echo "/ip firewall address-list remove [find list=\"$list_name\"]"
              echo "/ip firewall address-list"
              sort -u "$tmp" | grep '\.' | aggregate6 | sed "s|^|add list=\"$list_name\" address=|g"
            } > "$out_file"
            rm "$tmp"
          }

          gen_isp_v6() {
            local list_name=$1
            local out_file="data/${2}6.rsc"
            shift 2
            local asns=("$@")
            local tmp=$(mktemp)
            for id in "${asns[@]}"; do
              curl -sSLf "${ASN_URL}/${id}/ipv6-aggregated.txt" >> "$tmp" || true
            done
            {
              echo "/ipv6 firewall address-list remove [find list=\"${list_name}6\"]"
              echo "/ipv6 firewall address-list"
              sort -u "$tmp" | grep ':' | aggregate6 | sed "s|^|add list=\"${list_name}6\" address=|g"
            } > "$out_file"
            rm "$tmp"
          }

          gen_isp_v4 "China_Telecom" "chinatelecom" "telecom"
          gen_isp_v6 "China_Telecom" "telecom" "4134" "4809" "23764"

          gen_isp_v4 "China_Unicom" "chinaunicom" "unicom"
          gen_isp_v6 "China_Unicom" "unicom" "4837" "9929" "17622" "10099"

          gen_isp_v4 "China_Mobile" "chinamobile" "cmcc"
          gen_isp_v6 "China_Mobile" "cmcc" "9808" "58453" "9394"

          gen_isp_v4 "CERNET" "cernet" "cernet"
          gen_isp_v6 "CERNET" "cernet" "23910" "4538"

          gen_isp_v4 "CSTNET" "cstnet" "cstnet"
          gen_isp_v6 "CSTNET" "cstnet" "7497"

          gen_isp_v4 "DRPENG" "drpeng" "drpeng"
          gen_isp_v6 "DRPENG" "drpeng" "17962"

          CN_V4_FINAL=$(mktemp)
          echo "10.10.10.0/25" >> "$CN_V4_FINAL"
          echo "172.16.100.0/28" >> "$CN_V4_FINAL"
          curl -sSL http://ftp.apnic.net/stats/apnic/delegated-apnic-latest | grep ipv4 | grep CN | awk -F'|' '{printf "%s/%d\n", $4, 32-log($5)/log(2)}' >> "$CN_V4_FINAL"
          {
            echo "/ip firewall address-list remove [find list=\"CN\"]"
            echo "/ip firewall address-list"
            sort -u "$CN_V4_FINAL" | grep '\.' | aggregate6 | sed "s|^|add list=\"CN\" address=|g"
          } > data/cn.rsc

          {
            echo "/ipv6 firewall address-list remove [find list=\"CN6\"]"
            echo "/ipv6 firewall address-list"
            sort -u "$CN_V6_BASE" | grep ':' | aggregate6 | sed "s|^|add list=\"CN6\" address=|g"
          } > data/cn6.rsc

          rm "$CN_V6_BASE" "$CN_V4_FINAL"

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.rsc
          git diff --quiet && git diff --staged --quiet || git commit -m "Update IP lists $(date +%Y-%m-%d)"
          git push origin main
