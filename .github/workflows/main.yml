name: Generate MikroTik v7 IP Lists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools
        run: pip install aggregate6

      - name: Process IP Lists
        run: |
          mkdir -p data
          METO_BASE="https://raw.githubusercontent.com/metowolf/iplist/master/data/isp"

          process_metowolf() {
            local list_name=$1
            local meto_file=$2
            local out_v4="data/${3}.rsc"
            local out_v6="data/${3}6.rsc"
            local tmp_raw=$(mktemp)

            curl -sSLf "${METO_BASE}/${meto_file}.txt" > "$tmp_raw" || true

            {
              echo "/ip firewall address-list remove [find list=\"$list_name\"]"
              echo "/ip firewall address-list"
              grep '\.' "$tmp_raw" | sort -u | aggregate6 | sed "s|^|add list=\"$list_name\" address=|g"
            } > "$out_v4"

            {
              echo "/ipv6 firewall address-list remove [find list=\"${list_name}6\"]"
              echo "/ipv6 firewall address-list"
              grep ':' "$tmp_raw" | sort -u | aggregate6 | sed "s|^|add list=\"${list_name}6\" address=|g"
            } > "$out_v6"
            rm "$tmp_raw"
          }

          process_metowolf "China_Telecom" "chinatelecom" "telecom"
          process_metowolf "China_Unicom" "chinaunicom" "unicom"
          process_metowolf "China_Mobile" "chinamobile" "cmcc"
          process_metowolf "CERNET" "cernet" "cernet"
          process_metowolf "CSTNET" "cstnet" "cstnet"
          process_metowolf "DRPENG" "drpeng" "drpeng"

          CN_V4_TMP=$(mktemp)
          echo "10.10.10.0/25" >> "$CN_V4_TMP"
          echo "172.16.100.0/28" >> "$CN_V4_TMP"
          curl -sSL http://ftp.apnic.net/stats/apnic/delegated-apnic-latest | grep ipv4 | grep CN | awk -F'|' '{printf "%s/%d\n", $4, 32-log($5)/log(2)}' >> "$CN_V4_TMP"
          {
            echo "/ip firewall address-list remove [find list=\"CN\"]"
            echo "/ip firewall address-list"
            sort -u "$CN_V4_TMP" | grep '\.' | aggregate6 | sed "s|^|add list=\"CN\" address=|g"
          } > data/cn.rsc

          CN_V6_TMP=$(mktemp)
          curl -sSL http://ftp.apnic.net/stats/apnic/delegated-apnic-latest | grep ipv6 | grep CN | awk -F'|' '{printf "%s/%d\n", $4, $5}' >> "$CN_V6_TMP"
          {
            echo "/ipv6 firewall address-list remove [find list=\"CN6\"]"
            echo "/ipv6 firewall address-list"
            sort -u "$CN_V6_TMP" | grep ':' | aggregate6 | sed "s|^|add list=\"CN6\" address=|g"
          } > data/cn6.rsc

          rm "$CN_V4_TMP" "$CN_V6_TMP"

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.rsc
          git diff --quiet && git diff --staged --quiet || git commit -m "Update IP lists $(date +%Y-%m-%d)"
          git push origin main
