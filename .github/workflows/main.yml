name: Generate Accurate MikroTik v7 IP Lists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process IP Lists
        run: |
          mkdir -p data

          convert_to_ros() {
            local url=$1
            local list_name=$2
            local is_v6=$3
            local out_file=$4

            local cmd_path="/ip firewall address-list"
            if [ "$is_v6" = "true" ]; then
              cmd_path="/ipv6 firewall address-list"
            fi

            tmp_file=$(mktemp)
            curl -sSL --retry 3 --connect-timeout 10 "$url" > "$tmp_file"

            if [ ! -s "$tmp_file" ] || grep -q "404: Not Found" "$tmp_file"; then
              echo "# Empty or file not found, skipped" > "$out_file"
              rm -f "$tmp_file"
              return
            fi

            {
              echo "$cmd_path remove [find list=\"$list_name\"]"
              echo "$cmd_path"
              grep -E '^[0-9a-fA-F:\./]+' "$tmp_file" | grep -v '^#' | sed "s|^|add list=\"$list_name\" address=|g"
            } > "$out_file"

            rm -f "$tmp_file"
          }

          RAW_BASE="https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists"

          convert_to_ros "$RAW_BASE/chinanet.txt"  "China_Telecom"  false "data/telecom.rsc"
          convert_to_ros "$RAW_BASE/chinanet6.txt" "China_Telecom6" true  "data/telecom6.rsc"

          convert_to_ros "$RAW_BASE/unicom.txt"    "China_Unicom"   false "data/unicom.rsc"
          convert_to_ros "$RAW_BASE/unicom6.txt"   "China_Unicom6"  true  "data/unicom6.rsc"

          convert_to_ros "$RAW_BASE/cmcc.txt"      "China_Mobile"   false "data/cmcc.rsc"
          convert_to_ros "$RAW_BASE/cmcc6.txt"     "China_Mobile6"  true  "data/cmcc6.rsc"

          convert_to_ros "$RAW_BASE/cernet.txt"    "CERNET"         false "data/cernet.rsc"
          convert_to_ros "$RAW_BASE/cernet6.txt"   "CERNET6"        true  "data/cernet6.rsc"

          convert_to_ros "$RAW_BASE/cstnet.txt"    "CSTNET"         false "data/cstnet.rsc"
          convert_to_ros "$RAW_BASE/cstnet6.txt"   "CSTNET6"        true  "data/cstnet6.rsc"

          convert_to_ros "$RAW_BASE/drpeng.txt"    "DRPENG"         false "data/drpeng.rsc"
          convert_to_ros "$RAW_BASE/drpeng6.txt"   "DRPENG6"        true  "data/drpeng6.rsc"

          convert_to_ros "$RAW_BASE/china.txt"     "CN"             false "data/cn.rsc"
          convert_to_ros "$RAW_BASE/china6.txt"    "CN6"            true  "data/cn6.rsc"

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.rsc
          git diff --quiet && git diff --staged --quiet || git commit -m "Update RouterOS IP lists $(date +%Y-%m-%d)"
          git push origin main
