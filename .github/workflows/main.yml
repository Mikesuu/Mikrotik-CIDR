name: Generate MikroTik v7 IP Lists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process IP Lists
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT

          BASE_GAOYIFAN="https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists"
          BASE_METOWOLF="https://metowolf.github.io/iplist/data"

          download() {
            local url="$1"
            local output="$2"

            echo "Download: $url"

            curl \
              -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 120 \
              "$url" \
              -o "$output"

            if [ ! -s "$output" ]; then
              echo "ERROR: downloaded file is empty: $url"
              return 1
            fi
          }

          parse_and_merge() {
            local input="$1"
            local output="$2"
            local family="$3"
            local name="$4"
            local minimum="$5"

            python3 - "$input" "$output" "$family" "$name" "$minimum" << 'PY'
          import sys
          import ipaddress

          src = sys.argv[1]
          dst = sys.argv[2]
          family = sys.argv[3]
          name = sys.argv[4]
          minimum = int(sys.argv[5])

          networks = []
          invalid = 0

          with open(src, "r", encoding="utf-8-sig", errors="ignore") as f:
              for raw in f:
                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue

                  line = line.split("#", 1)[0].strip()

                  if not line:
                      continue

                  try:
                      net = ipaddress.ip_network(line, strict=False)
                  except ValueError:
                      invalid += 1
                      continue

                  if family == "ipv4" and net.version != 4:
                      continue

                  if family == "ipv6" and net.version != 6:
                      continue

                  if net.is_loopback:
                      continue

                  if net.is_link_local:
                      continue

                  if net.is_multicast:
                      continue

                  networks.append(net)

          if not networks:
              print(f"ERROR: {name} contains no valid {family} prefixes")
              sys.exit(1)

          merged = list(ipaddress.collapse_addresses(networks))

          if len(merged) < minimum:
              print(
                  f"ERROR: {name} contains only "
                  f"{len(merged)} aggregated prefixes, "
                  f"minimum is {minimum}"
              )
              sys.exit(1)

          with open(dst, "w", encoding="utf-8") as f:
              for net in merged:
                  f.write(str(net) + "\n")

          print(
              f"OK: {name} "
              f"source={len(networks)} "
              f"aggregated={len(merged)} "
              f"invalid={invalid}"
          )
          PY
          }

          export_rsc() {
            local list_name="$1"
            local input="$2"
            local output="$3"
            local ipv6="$4"

            if [ "$ipv6" = "true" ]; then
              local command="/ipv6 firewall address-list"
            else
              local command="/ip firewall address-list"
            fi

            python3 - "$list_name" "$input" "$output" "$command" << 'PY'
          import sys

          list_name = sys.argv[1]
          source = sys.argv[2]
          output = sys.argv[3]
          command = sys.argv[4]

          with open(output, "w", encoding="utf-8") as out:
              out.write(
                  f'{command} remove [find list="{list_name}"]\n'
              )
              out.write(f'{command}\n')

              with open(source, "r", encoding="utf-8") as f:
                  for line in f:
                      address = line.strip()

                      if not address:
                          continue

                      out.write(
                          f'add list="{list_name}" '
                          f'address={address}\n'
                      )
          PY
          }

          echo "========================================"
          echo "China IPv4"
          echo "========================================"

          CN_GAOYIFAN="$WORKDIR/china-gaoyifan.txt"
          CN_METOWOLF="$WORKDIR/china-metowolf.txt"
          CN_LOCAL="$WORKDIR/local.txt"
          CN_RAW="$WORKDIR/cn.raw"
          CN_FINAL="$WORKDIR/cn.final"

          download \
            "$BASE_GAOYIFAN/china.txt" \
            "$CN_GAOYIFAN"

          download \
            "$BASE_METOWOLF/special/china.txt" \
            "$CN_METOWOLF"

          parse_and_merge \
            "$CN_GAOYIFAN" \
            "$WORKDIR/china-gaoyifan.final" \
            "ipv4" \
            "gaoyifan china IPv4" \
            3000

          parse_and_merge \
            "$CN_METOWOLF" \
            "$WORKDIR/china-metowolf.final" \
            "ipv4" \
            "metowolf china IPv4" \
            3000

          printf '%s\n' \
            "10.10.10.0/25" \
            "172.16.100.0/28" \
            > "$CN_LOCAL"

          cat \
            "$CN_LOCAL" \
            "$CN_GAOYIFAN" \
            "$CN_METOWOLF" \
            > "$CN_RAW"

          parse_and_merge \
            "$CN_RAW" \
            "$CN_FINAL" \
            "ipv4" \
            "CN" \
            3000

          export_rsc \
            "CN" \
            "$CN_FINAL" \
            "data/cn.rsc" \
            "false"

          echo "========================================"
          echo "China IPv6"
          echo "========================================"

          CN6_GAOYIFAN="$WORKDIR/china6-gaoyifan.txt"
          CN6_FINAL="$WORKDIR/cn6.final"

          download \
            "$BASE_GAOYIFAN/china6.txt" \
            "$CN6_GAOYIFAN"

          parse_and_merge \
            "$CN6_GAOYIFAN" \
            "$CN6_FINAL" \
            "ipv6" \
            "CN6" \
            500

          export_rsc \
            "CN6" \
            "$CN6_FINAL" \
            "data/cn6.rsc" \
            "true"

          echo "========================================"
          echo "Operator IPv4"
          echo "========================================"

          declare -A ISP_V4=(
            [China_Telecom]="chinanet.txt"
            [China_Unicom]="unicom.txt"
            [China_Mobile]="cmcc.txt"
            [CERNET]="cernet.txt"
            [CSTNET]="cstnet.txt"
            [DRPENG]="drpeng.txt"
          )

          declare -A ISP_V4_OUTPUT=(
            [China_Telecom]="data/telecom.rsc"
            [China_Unicom]="data/unicom.rsc"
            [China_Mobile]="data/cmcc.rsc"
            [CERNET]="data/cernet.rsc"
            [CSTNET]="data/cstnet.rsc"
            [DRPENG]="data/drpeng.rsc"
          )

          for list_name in "${!ISP_V4[@]}"; do
            source="$WORKDIR/${list_name}.txt"
            final="$WORKDIR/${list_name}.final"

            download \
              "$BASE_GAOYIFAN/${ISP_V4[$list_name]}" \
              "$source"

            parse_and_merge \
              "$source" \
              "$final" \
              "ipv4" \
              "$list_name" \
              1

            export_rsc \
              "$list_name" \
              "$final" \
              "${ISP_V4_OUTPUT[$list_name]}" \
              "false"
          done

          echo "========================================"
          echo "Operator IPv6"
          echo "========================================"

          declare -A ISP_V6=(
            [China_Telecom6]="chinanet6.txt"
            [China_Unicom6]="unicom6.txt"
            [China_Mobile6]="cmcc6.txt"
            [CERNET6]="cernet6.txt"
            [CSTNET6]="cstnet6.txt"
          )

          declare -A ISP_V6_OUTPUT=(
            [China_Telecom6]="data/telecom6.rsc"
            [China_Unicom6]="data/unicom6.rsc"
            [China_Mobile6]="data/cmcc6.rsc"
            [CERNET6]="data/cernet6.rsc"
            [CSTNET6]="data/cstnet6.rsc"
          )

          for list_name in "${!ISP_V6[@]}"; do
            source="$WORKDIR/${list_name}.txt"
            final="$WORKDIR/${list_name}.final"

            download \
              "$BASE_GAOYIFAN/${ISP_V6[$list_name]}" \
              "$source"

            parse_and_merge \
              "$source" \
              "$final" \
              "ipv6" \
              "$list_name" \
              1

            export_rsc \
              "$list_name" \
              "$final" \
              "${ISP_V6_OUTPUT[$list_name]}" \
              "true"
          done

          echo "========================================"
          echo "Final statistics"
          echo "========================================"

          for file in data/*.rsc; do
            count=$(grep -c '^add list=' "$file" || true)
            echo "$(basename "$file"): $count entries"
          done

      - name: Commit and Push
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/*.rsc

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit \
            -m "Update IP lists $(date +%Y-%m-%d)"

          git push origin main
