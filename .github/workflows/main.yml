name: Generate MikroTik v7 IP Lists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools
        run: pip install aggregate6

      - name: Process IP Lists
        run: |
          mkdir -p data
          METO_URL="https://raw.githubusercontent.com/metowolf/v2ray-rules-dat/release"
          GAO_URL="https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists"

          gen_rsc() {
            local list_name=$1
            local source_url=$2
            local is_v6=$3
            local out_file=$4
            local tmp_raw=$(mktemp)
            local cmd_path="/ip firewall address-list"
            [ "$is_v6" = "true" ] && cmd_path="/ipv6 firewall address-list"

            if [[ "$list_name" == "CN" && "$is_v6" == "false" ]]; then
              echo "10.10.10.0/25" >> "$tmp_raw"
              echo "172.16.100.0/28" >> "$tmp_raw"
            fi

            curl -sSLf "$source_url" >> "$tmp_raw" || true

            {
              echo "$cmd_path remove [find list=\"$list_name\"]"
              echo "$cmd_path"
              sort -u "$tmp_raw" | grep -E '(\.|:)' | aggregate6 | sed "s|^|add list=\"$list_name\" address=|g"
            } > "$out_file"
            rm "$tmp_raw"
          }

          gen_rsc "China_Telecom" "${METO_URL}/telecom_ipv4.txt" "false" "data/telecom.rsc"
          gen_rsc "China_Unicom" "${METO_URL}/unicom_ipv4.txt" "false" "data/unicom.rsc"
          gen_rsc "China_Mobile" "${METO_URL}/mobile_ipv4.txt" "false" "data/cmcc.rsc"
          
          gen_rsc "China_Telecom6" "${METO_URL}/telecom_ipv6.txt" "true" "data/telecom6.rsc"
          gen_rsc "China_Unicom6" "${METO_URL}/unicom_ipv6.txt" "true" "data/unicom6.rsc"
          gen_rsc "China_Mobile6" "${METO_URL}/mobile_ipv6.txt" "true" "data/cmcc6.rsc"

          gen_rsc "CERNET" "${GAO_URL}/cernet.txt" "false" "data/cernet.rsc"
          gen_rsc "CERNET6" "${GAO_URL}/cernet6.txt" "true" "data/cernet6.rsc"
          gen_rsc "CSTNET" "${GAO_URL}/cstnet.txt" "false" "data/cstnet.rsc"
          gen_rsc "CSTNET6" "${GAO_URL}/cstnet6.txt" "true" "data/cstnet6.rsc"

          CN_V4_TMP=$(mktemp)
          echo "10.10.10.0/25" >> "$CN_V4_TMP"
          echo "172.16.100.0/28" >> "$CN_V4_TMP"
          curl -sSL http://ftp.apnic.net/stats/apnic/delegated-apnic-latest | grep ipv4 | grep CN | awk -F'|' '{printf "%s/%d\n", $4, 32-log($5)/log(2)}' >> "$CN_V4_TMP"
          curl -sSLf "${GAO_URL}/china.txt" >> "$CN_V4_TMP"
          {
            echo "/ip firewall address-list remove [find list=\"CN\"]"
            echo "/ip firewall address-list"
            sort -u "$CN_V4_TMP" | aggregate6 | sed "s|^|add list=\"CN\" address=|g"
          } > data/cn.rsc

          CN_V6_TMP=$(mktemp)
          curl -sSL http://ftp.apnic.net/stats/apnic/delegated-apnic-latest | grep ipv6 | grep CN | awk -F'|' '{printf "%s/%d\n", $4, $5}' >> "$CN_V6_TMP"
          curl -sSLf "${GAO_URL}/china6.txt" >> "$CN_V6_TMP"
          {
            echo "/ipv6 firewall address-list remove [find list=\"CN6\"]"
            echo "/ipv6 firewall address-list"
            sort -u "$CN_V6_TMP" | aggregate6 | sed "s|^|add list=\"CN6\" address=|g"
          } > data/cn6.rsc

          rm "$CN_V4_TMP" "$CN_V6_TMP"

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.rsc
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Pure IP lists $(date +%Y-%m-%d)"
          git push origin main
