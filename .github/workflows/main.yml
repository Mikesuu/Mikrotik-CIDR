name: Generate MikroTik v7 IP Lists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process IP Lists
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT

          BASE_GAOYIFAN="https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists"
          BASE_METOWOLF="https://metowolf.github.io/iplist/data"

          download() {
            local url="$1"
            local output="$2"

            curl \
              -4 \
              -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 120 \
              "$url" \
              -o "$output"
          }

          validate_source() {
            local file="$1"
            local min_count="$2"
            local name="$3"
            local family="$4"

            if [ ! -s "$file" ]; then
              echo "ERROR: $name is empty"
              exit 1
            fi

            local count

            if [ "$family" = "ipv4" ]; then
              count=$(grep -Ec '^[[:space:]]*([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?[[:space:]]*$' "$file" || true)
            else
              count=$(grep -Ec '^[[:space:]]*[0-9A-Fa-f:]+(/[0-9]{1,3})?[[:space:]]*$' "$file" || true)
            fi

            if [ "$count" -lt "$min_count" ]; then
              echo "ERROR: $name contains only $count valid prefixes, minimum is $min_count"
              exit 1
            fi

            echo "OK: $name source = $count prefixes"
          }

          normalize_and_merge() {
            local input="$1"
            local output="$2"
            local family="$3"

            python3 - "$input" "$output" "$family" << 'PY'
          import sys
          import ipaddress

          src = sys.argv[1]
          dst = sys.argv[2]
          family = sys.argv[3]

          networks = []

          with open(src, "r", encoding="utf-8", errors="ignore") as f:
              for raw in f:
                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue

                  line = line.split("#", 1)[0].strip()

                  if not line:
                      continue

                  try:
                      net = ipaddress.ip_network(line, strict=False)
                  except ValueError:
                      continue

                  if family == "ipv4" and net.version != 4:
                      continue

                  if family == "ipv6" and net.version != 6:
                      continue

                  if net.is_loopback:
                      continue

                  if net.is_link_local:
                      continue

                  if net.is_multicast:
                      continue

                  networks.append(net)

          networks = list(ipaddress.collapse_addresses(networks))

          with open(dst, "w", encoding="utf-8") as f:
              for network in networks:
                  f.write(str(network) + "\n")

          print(f"{dst}: {len(networks)} aggregated prefixes")
          PY
          }

          validate_final() {
            local file="$1"
            local min_count="$2"
            local name="$3"

            if [ ! -s "$file" ]; then
              echo "ERROR: final $name is empty"
              exit 1
            fi

            local count
            count=$(wc -l < "$file")

            if [ "$count" -lt "$min_count" ]; then
              echo "ERROR: final $name contains only $count prefixes, minimum is $min_count"
              exit 1
            fi

            echo "OK: final $name = $count prefixes"
          }

          export_rsc() {
            local list_name="$1"
            local input="$2"
            local output="$3"
            local ipv6="$4"

            local command="/ip firewall address-list"

            if [ "$ipv6" = "true" ]; then
              command="/ipv6 firewall address-list"
            fi

            python3 - "$list_name" "$input" "$output" "$command" << 'PY'
          import sys

          list_name = sys.argv[1]
          source = sys.argv[2]
          output = sys.argv[3]
          command = sys.argv[4]

          with open(output, "w", encoding="utf-8") as out:
              out.write(f'{command} remove [find list="{list_name}"]\n')
              out.write(f'{command}\n')

              with open(source, "r", encoding="utf-8") as f:
                  for line in f:
                      address = line.strip()

                      if not address:
                          continue

                      out.write(
                          f'add list="{list_name}" address={address}\n'
                      )
          PY
          }

          echo "========================================"
          echo "Download China mainland IPv4 sources"
          echo "========================================"

          CN_GAOYIFAN="$WORKDIR/china-gaoyifan.txt"
          CN_METOWOLF="$WORKDIR/china-metowolf.txt"
          CN_LOCAL="$WORKDIR/local.txt"
          CN_RAW="$WORKDIR/cn.raw"
          CN_FINAL="$WORKDIR/cn.final"

          download \
            "$BASE_GAOYIFAN/china.txt" \
            "$CN_GAOYIFAN"

          download \
            "$BASE_METOWOLF/special/china.txt" \
            "$CN_METOWOLF"

          validate_source \
            "$CN_GAOYIFAN" \
            3000 \
            "gaoyifan china IPv4" \
            "ipv4"

          validate_source \
            "$CN_METOWOLF" \
            3000 \
            "metowolf china IPv4" \
            "ipv4"

          printf '%s\n' \
            "10.10.10.0/25" \
            "172.16.100.0/28" \
            > "$CN_LOCAL"

          cat \
            "$CN_LOCAL" \
            "$CN_GAOYIFAN" \
            "$CN_METOWOLF" \
            > "$CN_RAW"

          normalize_and_merge \
            "$CN_RAW" \
            "$CN_FINAL" \
            "ipv4"

          validate_final \
            "$CN_FINAL" \
            3000 \
            "CN"

          echo "========================================"
          echo "Download China mainland IPv6 source"
          echo "========================================"

          CN6_GAOYIFAN="$WORKDIR/china6-gaoyifan.txt"
          CN6_FINAL="$WORKDIR/cn6.final"

          download \
            "$BASE_GAOYIFAN/china6.txt" \
            "$CN6_GAOYIFAN"

          validate_source \
            "$CN6_GAOYIFAN" \
            500 \
            "gaoyifan china IPv6" \
            "ipv6"

          normalize_and_merge \
            "$CN6_GAOYIFAN" \
            "$CN6_FINAL" \
            "ipv6"

          validate_final \
            "$CN6_FINAL" \
            500 \
            "CN6"

          echo "========================================"
          echo "Download operator IPv4 lists"
          echo "========================================"

          declare -A ISP_V4=(
            [China_Telecom]="chinanet.txt"
            [China_Unicom]="unicom.txt"
            [China_Mobile]="cmcc.txt"
            [CERNET]="cernet.txt"
            [CSTNET]="cstnet.txt"
            [DRPENG]="drpeng.txt"
          )

          declare -A ISP_V4_MIN=(
            [China_Telecom]=100
            [China_Unicom]=100
            [China_Mobile]=50
            [CERNET]=10
            [CSTNET]=1
            [DRPENG]=1
          )

          for list_name in "${!ISP_V4[@]}"; do
            source_file="$WORKDIR/${list_name}.raw"
            final_file="$WORKDIR/${list_name}.final"
            source_name="${ISP_V4[$list_name]}"

            download \
              "$BASE_GAOYIFAN/$source_name" \
              "$source_file"

            validate_source \
              "$source_file" \
              "${ISP_V4_MIN[$list_name]}" \
              "$list_name" \
              "ipv4"

            normalize_and_merge \
              "$source_file" \
              "$final_file" \
              "ipv4"

            validate_final \
              "$final_file" \
              "${ISP_V4_MIN[$list_name]}" \
              "$list_name"

            case "$list_name" in
              China_Telecom)
                output="data/telecom.rsc"
                ;;
              China_Unicom)
                output="data/unicom.rsc"
                ;;
              China_Mobile)
                output="data/cmcc.rsc"
                ;;
              CERNET)
                output="data/cernet.rsc"
                ;;
              CSTNET)
                output="data/cstnet.rsc"
                ;;
              DRPENG)
                output="data/drpeng.rsc"
                ;;
            esac

            export_rsc \
              "$list_name" \
              "$final_file" \
              "$output" \
              "false"
          done

          echo "========================================"
          echo "Download operator IPv6 lists"
          echo "========================================"

          declare -A ISP_V6=(
            [China_Telecom6]="chinanet6.txt"
            [China_Unicom6]="unicom6.txt"
            [China_Mobile6]="cmcc6.txt"
            [CERNET6]="cernet6.txt"
            [CSTNET6]="cstnet6.txt"
            [DRPENG6]="drpeng6.txt"
          )

          declare -A ISP_V6_MIN=(
            [China_Telecom6]=50
            [China_Unicom6]=50
            [China_Mobile6]=20
            [CERNET6]=5
            [CSTNET6]=1
            [DRPENG6]=1
          )

          for list_name in "${!ISP_V6[@]}"; do
            source_file="$WORKDIR/${list_name}.raw"
            final_file="$WORKDIR/${list_name}.final"
            source_name="${ISP_V6[$list_name]}"

            download \
              "$BASE_GAOYIFAN/$source_name" \
              "$source_file"

            validate_source \
              "$source_file" \
              "${ISP_V6_MIN[$list_name]}" \
              "$list_name" \
              "ipv6"

            normalize_and_merge \
              "$source_file" \
              "$final_file" \
              "ipv6"

            validate_final \
              "$final_file" \
              "${ISP_V6_MIN[$list_name]}" \
              "$list_name"

            case "$list_name" in
              China_Telecom6)
                output="data/telecom6.rsc"
                ;;
              China_Unicom6)
                output="data/unicom6.rsc"
                ;;
              China_Mobile6)
                output="data/cmcc6.rsc"
                ;;
              CERNET6)
                output="data/cernet6.rsc"
                ;;
              CSTNET6)
                output="data/cstnet6.rsc"
                ;;
              DRPENG6)
                output="data/drpeng6.rsc"
                ;;
            esac

            export_rsc \
              "$list_name" \
              "$final_file" \
              "$output" \
              "true"
          done

          echo "========================================"
          echo "Generate CN / CN6"
          echo "========================================"

          export_rsc \
            "CN" \
            "$CN_FINAL" \
            "data/cn.rsc" \
            "false"

          export_rsc \
            "CN6" \
            "$CN6_FINAL" \
            "data/cn6.rsc" \
            "true"

          echo "========================================"
          echo "Final statistics"
          echo "========================================"

          for file in data/*.rsc; do
            count=$(grep -c '^add list=' "$file" || true)
            echo "$(basename "$file"): $count entries"
          done

      - name: Commit and Push
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/*.rsc

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update IP lists $(date +%Y-%m-%d)"
          git push origin main
