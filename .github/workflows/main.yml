name: Generate MikroTik v7 IP Lists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools
        run: pip install aggregate6

      - name: Process IP Lists
        run: |
          mkdir -p data
          METO_URL="https://raw.githubusercontent.com/metowolf/iplist/master/data/isp"
          ASN_URL="https://raw.githubusercontent.com/ipverse/asn-ip/master/as"
          
          CN_V6_BASE=$(mktemp)
          curl -sSL http://ftp.apnic.net/stats/apnic/delegated-apnic-latest | grep ipv6 | grep CN | awk -F'|' '{printf "%s/%d\n", $4, $5}' > "$CN_V6_BASE"

          cat << 'EOF' > filter_v6.py
          import ipaddress, sys
          def run():
              cn_nets = []
              with open(sys.argv[1]) as f:
                  for l in f:
                      l = l.strip()
                      if l and not l.startswith('#'):
                          try: cn_nets.append(ipaddress.ip_network(l))
                          except: pass
              
              with open(sys.argv[2]) as f:
                  for l in f:
                      l = l.strip()
                      if l and not l.startswith('#'):
                          try:
                              asn_net = ipaddress.ip_network(l)
                              if any(asn_net.overlaps(cn) for cn in cn_nets):
                                  print(asn_net)
                          except: pass
          if __name__ == "__main__":
              run()
          EOF

          gen_isp_v4() {
            local list_name=$1
            local meto_file=$2
            local out_file="data/${3}.rsc"
            local tmp=$(mktemp)
            curl -sSLf "${METO_URL}/${meto_file}.txt" > "$tmp" || true
            {
              echo "/ip firewall address-list remove [find list=\"$list_name\"]"
              echo "/ip firewall address-list"
              grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}' "$tmp" | sort -u | aggregate6 | sed "s|^|add list=\"$list_name\" address=|g"
            } > "$out_file"
            rm "$tmp"
          }

          gen_isp_v6_refined() {
            local list_name=$1
            local out_file="data/${2}6.rsc"
            shift 2
            local asns=("$@")
            local tmp_asn=$(mktemp)
            local tmp_final=$(mktemp)
            for id in "${asns[@]}"; do
              curl -sSLf "${ASN_URL}/${id}/ipv6-aggregated.txt" >> "$tmp_asn" || true
            done
            python3 filter_v6.py "$CN_V6_BASE" "$tmp_asn" > "$tmp_final"
            {
              echo "/ipv6 firewall address-list remove [find list=\"${list_name}6\"]"
              echo "/ipv6 firewall address-list"
              sort -u "$tmp_final" | aggregate6 | sed "s|^|add list=\"${list_name}6\" address=|g"
            } > "$out_file"
            rm "$tmp_asn" "$tmp_final"
          }

          gen_isp_v4 "China_Telecom" "chinatelecom" "telecom"
          gen_isp_v6_refined "China_Telecom" "telecom" "4134" "4809" "23764"

          gen_isp_v4 "China_Unicom" "chinaunicom" "unicom"
          gen_isp_v6_refined "China_Unicom" "unicom" "4837" "9929" "17622" "10099"

          gen_isp_v4 "China_Mobile" "chinamobile" "cmcc"
          gen_isp_v6_refined "China_Mobile" "cmcc" "9808" "58453" "9394"

          gen_isp_v4 "CERNET" "cernet" "cernet"
          gen_isp_v6_refined "CERNET" "cernet" "23910" "4538"

          gen_isp_v4 "CSTNET" "cstnet" "cstnet"
          gen_isp_v6_refined "CSTNET" "cstnet" "7497"

          gen_isp_v4 "DRPENG" "drpeng" "drpeng"
          gen_isp_v6_refined "DRPENG" "drpeng" "17962"

          CN_V4_FINAL=$(mktemp)
          echo "10.10.10.0/25" >> "$CN_V4_FINAL"
          echo "172.16.100.0/28" >> "$CN_V4_FINAL"
          curl -sSL http://ftp.apnic.net/stats/apnic/delegated-apnic-latest | grep ipv4 | grep CN | awk -F'|' '{printf "%s/%d\n", $4, 32-log($5)/log(2)}' >> "$CN_V4_FINAL"
          {
            echo "/ip firewall address-list remove [find list=\"CN\"]"
            echo "/ip firewall address-list"
            sort -u "$CN_V4_FINAL" | grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}' | aggregate6 | sed "s|^|add list=\"CN\" address=|g"
          } > data/cn.rsc

          {
            echo "/ipv6 firewall address-list remove [find list=\"CN6\"]"
            echo "/ipv6 firewall address-list"
            sort -u "$CN_V6_BASE" | grep ':' | aggregate6 | sed "s|^|add list=\"CN6\" address=|g"
          } > data/cn6.rsc

          rm "$CN_V6_BASE" "$CN_V4_FINAL" filter_v6.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.rsc
          git diff --quiet && git diff --staged --quiet || git commit -m "Update refined IP lists $(date +%Y-%m-%d)"
          git push origin main
