name: Generate MikroTik v7 IP Lists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate IP Lists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data WORKDIR

          GAOYIFAN="https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists"
          CHNROUTES2="https://raw.githubusercontent.com/misakaio/chnroutes2/master"

          download() {
            curl -fsSL --retry 5 --retry-delay 2 --connect-timeout 15 -A "Mozilla/5.0" "$1" -o "$2"
            [ -s "$2" ] || exit 1
          }

          download_soft() {
            curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 -A "Mozilla/5.0" "$1" -o "$2" || touch "$2"
          }

          download "$GAOYIFAN/china.txt" WORKDIR/cn-gaoyifan.txt
          download "$CHNROUTES2/chnroutes.txt" WORKDIR/cn-chnroutes2.txt
          download_soft "$GAOYIFAN/china6.txt" WORKDIR/cn6-gaoyifan.txt

          cat << 'EOF' > process.py
          import sys, ipaddress, os

          def normalize(src, dst, family):
              nets = []
              forbidden_v4 = [
                  ipaddress.ip_network("0.0.0.0/8"),
                  ipaddress.ip_network("10.0.0.0/8"),
                  ipaddress.ip_network("127.0.0.0/8"),
                  ipaddress.ip_network("169.254.0.0/16"),
                  ipaddress.ip_network("172.16.0.0/12"),
                  ipaddress.ip_network("192.168.0.0/16"),
                  ipaddress.ip_network("100.64.0.0/10"),
                  ipaddress.ip_network("224.0.0.0/4"),
                  ipaddress.ip_network("240.0.0.0/4")
              ]

              if os.path.exists(src):
                  with open(src, 'r', encoding='utf-8-sig', errors='ignore') as f:
                      for line in f:
                          line = line.strip()
                          if not line or line.startswith(('#', '//')):
                              continue

                          tokens = line.replace(',', ' ').split()
                          for t in tokens:
                              if family == "ipv6" and ":" not in t:
                                  continue
                              if family == "ipv4" and "." not in t:
                                  continue
                              try:
                                  net = ipaddress.ip_network(t, strict=False)

                                  if family == "ipv4":
                                      if net.version != 4 or net.prefixlen == 32:
                                          continue
                                      if any(net.overlaps(bad) for bad in forbidden_v4):
                                          continue

                                  elif family == "ipv6":
                                      if net.version != 6 or net.prefixlen == 128:
                                          continue

                                  nets.append(net)

                              except ValueError:
                                  pass

              merged = list(ipaddress.collapse_addresses(nets))

              with open(dst, 'w', encoding='utf-8') as f:
                  for net in merged:
                      f.write(f"{net}\n")

          cmd = sys.argv[1]
          if cmd == "norm":
              normalize(sys.argv[2], sys.argv[3], sys.argv[4])
          EOF

          cat WORKDIR/cn-gaoyifan.txt WORKDIR/cn-chnroutes2.txt > WORKDIR/cn-combined.raw

          python3 process.py norm WORKDIR/cn-combined.raw WORKDIR/cn-final.final ipv4
          python3 process.py norm WORKDIR/cn6-gaoyifan.txt WORKDIR/cn6-final.final ipv6

          export_rsc() {
            local list_name="$1"
            local input="$2"
            local output="$3"
            local ipv6="$4"

            local base_cmd="/ip firewall address-list"
            [ "$ipv6" = "true" ] && base_cmd="/ipv6 firewall address-list"

            {
              echo "$base_cmd remove [find where list=\"$list_name\"]"
              echo "$base_cmd"
              while IFS= read -r cidr; do
                [ -n "$cidr" ] && echo "add list=\"$list_name\" address=$cidr"
              done < "$input"
            } > "$output"
          }

          export_rsc "CN" WORKDIR/cn-final.final data/cn.rsc false
          export_rsc "CN6" WORKDIR/cn6-final.final data/cn6.rsc true

          ISPS_KEYS=("China_Telecom" "China_Unicom" "China_Mobile" "CERNET" "CSTNET" "DRPENG")
          ISPS_VALS=("chinanet.txt" "unicom.txt" "cmcc.txt" "cernet.txt" "cstnet.txt" "drpeng.txt")
          ISPS_FILES=("telecom" "unicom" "cmcc" "cernet" "cstnet" "drpeng")

          for i in "${!ISPS_KEYS[@]}"; do
            list_name="${ISPS_KEYS[$i]}"
            file="${ISPS_VALS[$i]}"
            out_file="${ISPS_FILES[$i]}"

            download_soft "$GAOYIFAN/$file" "WORKDIR/$out_file.txt"

            python3 process.py norm "WORKDIR/$out_file.txt" "WORKDIR/$out_file.final" ipv4
            export_rsc "$list_name" "WORKDIR/$out_file.final" "data/$out_file.rsc" false
          done

          ISPS6_KEYS=("China_Telecom6" "China_Unicom6" "China_Mobile6" "CERNET6" "CSTNET6")
          ISPS6_VALS=("chinanet6.txt" "unicom6.txt" "cmcc6.txt" "cernet6.txt" "cstnet6.txt")
          ISPS6_FILES=("telecom6" "unicom6" "cmcc6" "cernet6" "cstnet6")

          for i in "${!ISPS6_KEYS[@]}"; do
            list_name="${ISPS6_KEYS[$i]}"
            file="${ISPS6_VALS[$i]}"
            out_file="${ISPS6_FILES[$i]}"

            download_soft "$GAOYIFAN/$file" "WORKDIR/$out_file.txt"

            python3 process.py norm "WORKDIR/$out_file.txt" "WORKDIR/$out_file.final" ipv6
            export_rsc "$list_name" "WORKDIR/$out_file.final" "data/$out_file.rsc" true
          done

      - name: Commit & Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/*.rsc

          if git diff --staged --quiet; then
            exit 0
          else
            git commit -m "Update RouterOS v7 IP lists"
            git push origin main
          fi
