name: Generate MikroTik v7 IP Lists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process IP Lists
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT

          BASE_GAOYIFAN="https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists"
          BASE_METOWOLF="https://metowolf.github.io/iplist/data"

          download() {
            local url="$1"
            local output="$2"

            curl \
              -4 \
              -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 120 \
              "$url" \
              -o "$output"
          }

          validate_source() {
            local file="$1"
            local min_lines="$2"
            local name="$3"

            if [ ! -s "$file" ]; then
              echo "ERROR: $name is empty"
              exit 1
            fi

            local count
            count=$(grep -Ec '^[[:space:]]*([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?[[:space:]]*$|^[[:space:]]*[0-9A-Fa-f:]+(/[0-9]{1,3})?[[:space:]]*$' "$file" || true)

            if [ "$count" -lt "$min_lines" ]; then
              echo "ERROR: $name contains only $count valid-looking prefixes, minimum is $min_lines"
              exit 1
            fi

            echo "OK: $name = $count prefixes"
          }

          normalize_and_merge() {
            local input="$1"
            local output="$2"
            local family="$3"

            python3 - "$input" "$output" "$family" << 'PY'
          import sys
          import ipaddress

          src = sys.argv[1]
          dst = sys.argv[2]
          family = sys.argv[3]

          nets = []

          with open(src, "r", encoding="utf-8", errors="ignore") as f:
              for raw in f:
                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue

                  line = line.split("#", 1)[0].strip()

                  try:
                      net = ipaddress.ip_network(line, strict=False)
                  except ValueError:
                      continue

                  if family == "ipv4" and net.version != 4:
                      continue

                  if family == "ipv6" and net.version != 6:
                      continue

                  if net.is_private or net.is_loopback or net.is_link_local or net.is_multicast:
                      continue

                  nets.append(net)

          merged = list(ipaddress.collapse_addresses(nets))

          with open(dst, "w", encoding="utf-8") as f:
              for net in merged:
                  f.write(str(net) + "\n")

          print(f"{dst}: {len(merged)} aggregated prefixes")
          PY
          }

          validate_final() {
            local file="$1"
            local min_lines="$2"
            local name="$3"

            if [ ! -s "$file" ]; then
              echo "ERROR: final $name is empty"
              exit 1
            fi

            local count
            count=$(wc -l < "$file")

            if [ "$count" -lt "$min_lines" ]; then
              echo "ERROR: final $name contains only $count prefixes, minimum is $min_lines"
              exit 1
            fi

            echo "OK: final $name = $count prefixes"
          }

          export_rsc() {
            local list_name="$1"
            local input="$2"
            local output="$3"
            local ipv6="$4"

            local cmd="/ip firewall address-list"

            if [ "$ipv6" = "true" ]; then
              cmd="/ipv6 firewall address-list"
            fi

            python3 - "$list_name" "$input" "$output" "$cmd" << 'PY'
          import sys

          list_name = sys.argv[1]
          src = sys.argv[2]
          dst = sys.argv[3]
          cmd = sys.argv[4]

          with open(dst, "w", encoding="utf-8") as out:
              out.write(f'{cmd} remove [find list="{list_name}"]\n')
              out.write(f'{cmd}\n')

              with open(src, "r", encoding="utf-8") as f:
                  for line in f:
                      ip = line.strip()

                      if not ip:
                          continue

                      out.write(f'add list="{list_name}" address={ip}\n')
          PY
          }

          echo "========================================"
          echo " Download China mainland IPv4 sources"
          echo "========================================"

          CN_GAOYIFAN="$WORKDIR/china-gaoyifan.txt"
          CN_METOWOLF="$WORKDIR/china-metowolf.txt"
          CN_RAW="$WORKDIR/cn.raw"
          CN_FINAL="$WORKDIR/cn.final"

          download \
            "$BASE_GAOYIFAN/china.txt" \
            "$CN_GAOYIFAN"

          download \
            "$BASE_METOWOLF/special/china.txt" \
            "$CN_METOWOLF"

          validate_source "$CN_GAOYIFAN" 3000 "gaoyifan china IPv4"
          validate_source "$CN_METOWOLF" 3000 "metowolf china IPv4"

          cat \
            "$CN_GAOYIFAN" \
            "$CN_METOWOLF" \
            > "$CN_RAW"

          normalize_and_merge \
            "$CN_RAW" \
            "$CN_FINAL" \
            "ipv4"

          validate_final "$CN_FINAL" 3000 "CN"

          echo "========================================"
          echo " Download China mainland IPv6 sources"
          echo "========================================"

          CN6_GAOYIFAN="$WORKDIR/china6-gaoyifan.txt"
          CN6_METOWOLF="$WORKDIR/china6-metowolf.txt"
          CN6_RAW="$WORKDIR/cn6.raw"
          CN6_FINAL="$WORKDIR/cn6.final"

          download \
            "$BASE_GAOYIFAN/china6.txt" \
            "$CN6_GAOYIFAN"

          download \
            "$BASE_METOWOLF/special/china6.txt" \
            "$CN6_METOWOLF"

          validate_source "$CN6_GAOYIFAN" 500 "gaoyifan china IPv6"
          validate_source "$CN6_METOWOLF" 500 "metowolf china IPv6"

          cat \
            "$CN6_GAOYIFAN" \
            "$CN6_METOWOLF" \
            > "$CN6_RAW"

          normalize_and_merge \
            "$CN6_RAW" \
            "$CN6_FINAL" \
            "ipv6"

          validate_final "$CN6_FINAL" 500 "CN6"

          echo "========================================"
          echo " Download operator IPv4 lists"
          echo "========================================"

          declare -A ISP_V4=(
            [China_Telecom]="chinanet.txt"
            [China_Unicom]="unicom.txt"
            [China_Mobile]="cmcc.txt"
            [CERNET]="cernet.txt"
            [CSTNET]="cstnet.txt"
            [DRPENG]="drpeng.txt"
          )

          declare -A ISP_V6=(
            [China_Telecom6]="chinanet6.txt"
            [China_Unicom6]="unicom6.txt"
            [China_Mobile6]="cmcc6.txt"
            [CERNET6]="cernet6.txt"
            [CSTNET6]="cstnet6.txt"
            [DRPENG6]="drpeng6.txt"
          )

          for list_name in "${!ISP_V4[@]}"; do
            source_file="$WORKDIR/${list_name}.raw"
            final_file="$WORKDIR/${list_name}.final"
            source_name="${ISP_V4[$list_name]}"

            download \
              "$BASE_GAOYIFAN/$source_name" \
              "$source_file"

            validate_source "$source_file" 20 "$list_name source"

            normalize_and_merge \
              "$source_file" \
              "$final_file" \
              "ipv4"

            validate_final "$final_file" 20 "$list_name"

            output="data/$(echo "$list_name" | tr '[:upper:]' '[:lower:]' | sed 's/china_//; s/6$//').rsc"

            export_rsc \
              "$list_name" \
              "$final_file" \
              "$output" \
              "false"
          done

          for list_name in "${!ISP_V6[@]}"; do
            source_file="$WORKDIR/${list_name}.raw"
            final_file="$WORKDIR/${list_name}.final"
            source_name="${ISP_V6[$list_name]}"

            download \
              "$BASE_GAOYIFAN/$source_name" \
              "$source_file"

            validate_source "$source_file" 10 "$list_name source"

            normalize_and_merge \
              "$source_file" \
              "$final_file" \
              "ipv6"

            validate_final "$final_file" 10 "$list_name"

            output="data/$(echo "$list_name" | tr '[:upper:]' '[:lower:]' | sed 's/china_//').rsc"

            export_rsc \
              "$list_name" \
              "$final_file" \
              "$output" \
              "true"
          done

          echo "========================================"
          echo " Generate CN / CN6"
          echo "========================================"

          export_rsc \
            "CN" \
            "$CN_FINAL" \
            "data/cn.rsc" \
            "false"

          export_rsc \
            "CN6" \
            "$CN6_FINAL" \
            "data/cn6.rsc" \
            "true"

          echo "========================================"
          echo " Final statistics"
          echo "========================================"

          for file in data/*.rsc; do
            echo "$(basename "$file"): $(grep -c '^add list=' "$file") entries"
          done

      - name: Commit and Push
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/*.rsc

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update IP lists $(date +%Y-%m-%d)"
          git push origin main
