name: Generate MikroTik v7 IP Lists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools
        run: pip install aggregate6

      - name: Process IP Lists
        run: |
          mkdir -p data
          METO_URL="https://raw.githubusercontent.com/metowolf/iplist/master/data/isp"
          GAO_URL="https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists"

          gen_isp_v4() {
            local list_name=$1
            local meto_file=$2
            local out_file=$3
            local tmp_raw=$(mktemp)
            curl -sSLf "${METO_URL}/${meto_file}.txt" > "$tmp_raw" || true
            {
              echo "/ip firewall address-list remove [find list=\"$list_name\"]"
              echo "/ip firewall address-list"
              sort -u "$tmp_raw" | grep '\.' | aggregate6 | sed "s|^|add list=\"$list_name\" address=|g"
            } > "$out_file"
            rm "$tmp_raw"
          }

          gen_isp_v6() {
            local list_name=$1
            local gao_file=$2
            local out_file=$3
            local tmp_raw=$(mktemp)
            curl -sSLf "${GAO_URL}/${gao_file}.txt" > "$tmp_raw" || true
            {
              echo "/ipv6 firewall address-list remove [find list=\"$list_name\"]"
              echo "/ipv6 firewall address-list"
              grep -i '^240' "$tmp_raw" | sort -u | aggregate6 | sed "s|^|add list=\"$list_name\" address=|g"
            } > "$out_file"
            rm "$tmp_raw"
          }

          gen_isp_v4 "China_Telecom" "chinatelecom" "data/telecom.rsc"
          gen_isp_v6 "China_Telecom6" "ct6" "data/telecom6.rsc"

          gen_isp_v4 "China_Unicom" "chinaunicom" "data/unicom.rsc"
          gen_isp_v6 "China_Unicom6" "cu6" "data/unicom6.rsc"

          gen_isp_v4 "China_Mobile" "chinamobile" "data/cmcc.rsc"
          gen_isp_v6 "China_Mobile6" "cm6" "data/cmcc6.rsc"

          gen_isp_v4 "CERNET" "cernet" "data/cernet.rsc"
          gen_isp_v6 "CERNET6" "cernet6" "data/cernet6.rsc"

          gen_isp_v4 "CSTNET" "cstnet" "data/cstnet.rsc"
          gen_isp_v6 "CSTNET6" "cstnet6" "data/cstnet6.rsc"

          gen_isp_v4 "DRPENG" "drpeng" "data/drpeng.rsc"
          gen_isp_v6 "DRPENG6" "drpeng6" "data/drpeng6.rsc"

          CN_V4_TMP=$(mktemp)
          echo "10.10.10.0/25" >> "$CN_V4_TMP"
          echo "172.16.100.0/28" >> "$CN_V4_TMP"
          curl -sSL http://ftp.apnic.net/stats/apnic/delegated-apnic-latest | grep ipv4 | grep CN | awk -F'|' '{printf "%s/%d\n", $4, 32-log($5)/log(2)}' >> "$CN_V4_TMP"
          curl -sSLf "${GAO_URL}/china.txt" >> "$CN_V4_TMP"
          {
            echo "/ip firewall address-list remove [find list=\"CN\"]"
            echo "/ip firewall address-list"
            sort -u "$CN_V4_TMP" | grep '\.' | aggregate6 | sed "s|^|add list=\"CN\" address=|g"
          } > data/cn.rsc

          CN_V6_TMP=$(mktemp)
          curl -sSL http://ftp.apnic.net/stats/apnic/delegated-apnic-latest | grep ipv6 | grep CN | awk -F'|' '{printf "%s/%d\n", $4, $5}' >> "$CN_V6_TMP"
          curl -sSLf "${GAO_URL}/china6.txt" >> "$CN_V6_TMP"
          {
            echo "/ipv6 firewall address-list remove [find list=\"CN6\"]"
            echo "/ipv6 firewall address-list"
            sort -u "$CN_V6_TMP" | grep ':' | aggregate6 | sed "s|^|add list=\"CN6\" address=|g"
          } > data/cn6.rsc

          rm "$CN_V4_TMP" "$CN_V6_TMP"

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.rsc
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Mixed Source IP lists $(date +%Y-%m-%d)"
          git push origin main
